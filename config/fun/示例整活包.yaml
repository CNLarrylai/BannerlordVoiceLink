# ===== 整活词典 · 示例包 =====
# 直播搞怪用的"猎奇说法"映射, 与正式词典完全分开管理:
#   - 复制这个文件改名, 就是你自己的定制版本 (想做几个版本做几个)
#   - 启用: settings.yaml 里  fun: → pack: 示例整活包   (不带 .yaml)
#   - 语音程序运行中按 F10 立即生效 —— 观众打赏了当场就能切
#   - 只追加说法, 不覆盖正式词典, 不改浮层显示名; 软件更新不会碰这个目录
#
# ⚠ 选词提醒: 别用你直播时高频对观众说的口头禅(如"家人们"), 否则聊天就误触。
#   整活词越"猎奇"越安全 —— 没人会无缘无故念"爸爸打我"。

name: 示例整活包

orders:
  charge: [爸爸打我, 奥利给]
  retreat: [风紧扯呼, 三十六计走为上]
  shield_wall: [叠甲, 先叠个甲]
  fire_at_will: [万箭齐发]
  follow_me: [护驾护驾]

groups: {}

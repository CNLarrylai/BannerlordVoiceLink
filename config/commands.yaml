# ============================================================
#  指令词典 —— 这是整个软件的"大脑", 你可以随意增删/改说法
# ============================================================
#
#  结构说明:
#   groups : 兵种/编队 -> 选中它要按的数字键 (0 = 全军听令)
#   orders : 指令      -> 选中编队后要按的按键序列
#   aliases: 中文说法; en: 英文说法 (启动器选语言, 两套分开用, 键位共用)
#
#  改完在语音程序里按 [F10] 热重载, 不用重启。
#  ⚠️ 按键序列必须与 docs/bannerlord-orders.md 一致; 禁止凭感觉改键位。
# ============================================================

groups:
  infantry:
    key: "1"
    aliases: [步兵, 步兵们, 步卒, 盾兵, 刀盾兵, 长矛兵, 近战, 近战兵, 大头兵,
              一队, 第一队, 步兵队]
    en: [infantry, foot, footmen, foot soldiers, spearmen, group one, first group]
  archers:
    key: "2"
    aliases: [弓箭手, 弓箭手们, 弓兵, 射手, 神射手, 弓弩手, 远程, 弓手, 射箭的,
              放箭的, 二队, 第二队]
    en: [archers, bowmen, ranged, bows, archer, group two, second group]
  cavalry:
    key: "3"
    # 注意: 别名不能"包含其它指令的完整别名"(如曾有的"冲锋骑"包含"冲锋"),
    # 否则光杆短指令会滑进长别名拿满分, 同分比长度反而错赢 -> 乱路由。
    aliases: [骑兵, 骑兵们, 重骑, 重骑兵, 骑士, 突骑, 马队, 骑马的,
              三队, 第三队]
    en: [cavalry, horsemen, knights, horse, riders, group three, third group]
  horse_archers:
    key: "4"
    aliases: [骑射, 骑射手, 骑射兵, 骑射们, 第四队, 四队, 四号队, 游骑,
              弓骑, 弓骑兵, 空骑兵, 空骑手]
    en: [horse archers, mounted archers, horse archer, group four, fourth group]
  all:
    key: "0"
    aliases: [全军, 全体, 所有人, 所有队伍, 大家, 大伙, 大伙儿, 士兵, 士兵们,
              全部队伍, 全部人, 全员, 儿郎们, 众将士, 全军将士, 各队, 各位]
    en: [everyone, all troops, all units, everybody, whole army, all of you, all]
  # 光喊"左队/右队"(不带兵种): 默认指最近分的那队(混战里最顺口)。想明确指定
  # 哪个兵种的半队, 用下面带前缀的 <兵种>左队。
  left:
    key: ""
    aliases: [左队, 左半队, 左边那队, 左路队, 左翼队]
    en: [left group, left half]
  right:
    key: ""
    aliases: [右队, 右半队, 右边那队, 右路队, 右翼队]
    en: [right group, right half]
  # 分队后的左/右半队(需模组): key 名 = <兵种>_<left|right>, 是"伪兵种",
  # 只用来解析"哪个兵种的哪半队", 由 main 拆出兵种+左右路由给模组 sideorder。
  # 左=原队, 右=新分出的队(固定身份, 不看位置); 必须带兵种前缀防混淆
  # (骑兵分左右 与 弓箭手分左右 各记一套)。别名首项=浮层显示名。
  infantry_left:
    key: ""
    aliases: [步兵左队, 步兵左, 左路步兵, 左边步兵, 步兵左路, 步兵左半]
    en: [infantry left, left infantry]
  infantry_right:
    key: ""
    aliases: [步兵右队, 步兵右, 右路步兵, 右边步兵, 步兵右路, 步兵右半]
    en: [infantry right, right infantry]
  archers_left:
    key: ""
    aliases: [弓箭手左队, 弓箭手左, 弓兵左队, 左路弓箭手, 左边弓箭手, 弓兵左]
    en: [archers left, left archers]
  archers_right:
    key: ""
    aliases: [弓箭手右队, 弓箭手右, 弓兵右队, 右路弓箭手, 右边弓箭手, 弓兵右]
    en: [archers right, right archers]
  cavalry_left:
    key: ""
    aliases: [骑兵左队, 骑兵左, 左路骑兵, 左边骑兵, 骑兵左路, 骑兵左半]
    en: [cavalry left, left cavalry]
  cavalry_right:
    key: ""
    aliases: [骑兵右队, 骑兵右, 右路骑兵, 右边骑兵, 骑兵右路, 骑兵右半]
    en: [cavalry right, right cavalry]
  horse_archers_left:
    key: ""
    aliases: [骑射左队, 骑射左, 左路骑射, 左边骑射, 骑射左路, 骑射手左队]
    en: [horse archers left, left horse archers]
  horse_archers_right:
    key: ""
    aliases: [骑射右队, 骑射右, 右路骑射, 右边骑射, 骑射右路, 骑射手右队]
    en: [horse archers right, right horse archers]
  # 按编队槽位号直接指挥(需模组): 第五~八队是分队后新队落的空槽(第一~四队
  # 已是步/弓/骑/骑射的别名, 走按键)。key 名 form<N> 由 main 拆出槽位号路由。
  # "第五队"这类纯位置编号谁都懂, 和"骑兵右队"指同一支队, 两个名字都能喊。
  form5:
    key: ""
    aliases: [第五队, 五队, 第5队, 五号队]
    en: [fifth group, formation five, group five]
  form6:
    key: ""
    aliases: [第六队, 六队, 第6队, 六号队]
    en: [sixth group, formation six, group six]
  form7:
    key: ""
    aliases: [第七队, 七队, 第7队, 七号队]
    en: [seventh group, formation seven, group seven]
  form8:
    key: ""
    aliases: [第八队, 八队, 第8队, 八号队]
    en: [eighth group, formation eight, group eight]

orders:
  # ---------- 移动类 (F1 子菜单) ----------
  to_position:
    keys: [f1, f1]
    aliases: [到这里, 去那里, 来这里, 守住这里, 到指定位置, 就位, 到位, 去那儿,
              到这儿, 来这儿, 守这儿, 站这儿, 待在这儿, 去那边儿, 到那边儿,
              守住这儿, 去那边, 到那边, 守这里, 站这里, 过来]
    en: [move here, go there, hold this position, take position, move to position]
  follow_me:
    keys: [f1, f2]
    aliases: [随我来, 跟随我, 跟着我, 跟我走, 跟我上, 跟我冲, 跟上, 跟着我走,
              都跟上, 跟紧我, 跟紧点儿, 跟我来, 都跟着我, 护驾, 救驾, 保护我,
              来救我, 到我这里来, 到我这儿来, 来我这, 到我身边, 别掉队]
    en: [follow me, on me, with me, rally to me, stay with me]
  charge:
    # 指向性攻击(游戏1.2+原生): 鼠标/准星指着敌方编队图标(出现绿色四角准星)
    # 时下这条指令, 就会攻击那支特定敌军 —— "看着谁就打谁", 键序完全相同。
    # takes_target: 允许"骑兵进攻弓箭手"句式 —— 动词前=选自家谁, 动词后=打谁
    # (目标显示在浮层, 实际锁定靠准星悬停; 未来模组接管后变成真锁定)。
    takes_target: true
    keys: [f1, f3]
    # 注: "打他们/打他" 移到 focus_target(集火眼前那支, 玩家'打他打他'的直觉);
    # charge 泛指冲锋保留"冲他们/攻击他们"等。
    # "出击"必须显式收录: 不在词典时, "全军出击"会被"护驾"(hujia)拼音蹭到89分
    # 错路由成跟随我(2026-07-09 实战日志钓出, 连错三次)。
    aliases: [冲锋, 冲, 进攻, 突击, 出击, 杀, 给我冲, 冲上去, 冲啊, 冲呀, 冲鸭,
              给我上, 上啊, 冲过去, 杀过去, 干他们, 打过去, 给我杀, 杀啊,
              往上冲, 压上去打, 冲他们, 攻击他们, 灭了他们, 开干, 开团, 怼上去]
    en: [charge, attack, engage, charge them, attack them, go get them,
         take them out, focus them, kill them]
  # 注: 曾有独立的 attack_nearest("打最近的"), 已删 —— 游戏原生冲锋(charge)
  # 本就让编队去打最近的敌人, 单列冗余。模组的独特价值是"定向按兵种攻击"
  # (骑兵专打敌弓箭手), 走 charge 的 takes_target, 不需要单独指令。
  advance:
    takes_target: true   # 交战(F1F4)同样支持指向性目标, 见 charge 注释
    keys: [f1, f4]
    aliases: [开战, 交战, 前进, 进军, 推进, 慢慢推进, 上前, 向前, 往前走, 压上去,
              顶上去, 向前推, 推上去, 往前压, 往前顶, 上前压, 压上]
    en: [advance, move up, push forward, forward, push up, engage the enemy]
  split:
    # 需伴侣模组: 把某兵种一分为二(原生 Formation.Split), 之后可"左队/右队"
    # 分别指挥。keys 空 —— 纯模组指令, 不走按键; 需搭配具体兵种("骑兵分队")。
    keys: []
    aliases: [分队, 一分为二, 分成两队, 分兵, 分成两拨, 一分为二分队, 拆成两队,
              分作两队, 分兵两路]
    en: [split, divide, split in two, split up, divide in two]
  focus_target:
    # 需伴侣模组: 集火离玩家最近的那支敌军(混战里"打这只军队/打他打他"最本能,
    # 多半就指玩家眼前那支)。所有被下令编队集火同一支。模组不可用退化为
    # 普通冲锋(F1F3)。别名刻意与 charge 的"打他们"(泛指全军冲锋)区分。
    # "军队"曾被误认成兵种"马队", 已在 matcher 的"寄生子串抑制"里根治。
    modlink_target: player
    keys: [f1, f3]
    aliases: [打这只, 打这只军队, 打那只, 打那只军队, 就打这只, 集火这只,
              集火这只军队, 打这一只, 打面前这只, 灭了这只, 打眼前这只,
              打他们, 打他, 打他打他, 秒他, 搞他, 盯着这只打, 集火, 集火他]
    en: [get that one, focus that, attack that one, hit that one, focus fire]
  fall_back:
    keys: [f1, f5]
    # "回来"显式收录: 实战高频说法(骑兵回来/弓箭手回来), 曾只靠"退回来"模糊80分接
    aliases: [退后, 后退, 回来, 撤一点, 往后, 后撤, 往后退, 退一退, 撤一撤, 往后撤,
              退回来, 后撤点儿, 往后点儿, 往后退点儿, 退一点儿, 回防]
    en: [fall back, pull back, back up, move back, give ground]
  halt:
    keys: [f1, f6]
    aliases: [立定, 停止, 停下, 站住, 原地待命, 待命, 别动, 停, 停一停, 都别动,
              原地不动, 稳住, 别走, 停在那儿, 站那儿别动, 都停下, 都停一停, 停停停]
    en: [halt, stop, hold, stand ground, hold position, hold there, stay here,
         stay put, stay there, hold your ground, stand your ground,
         hold your position, remain here, dont move, freeze]
  retreat:
    keys: [f1, f7]
    aliases: [撤退, 快跑, 撤离, 快撤, 撤了, 跑路, 快跑啊, 撤退了,
              撤下来, 都撤, 快撤啊, 撤退吧]
    en: [retreat, run away, flee, sound the retreat, pull out]

  # ---------- 队形类 (F2 子菜单) ----------
  line:
    keys: [f9]
    aliases: [线阵, 横队, 一字排开, 排成线, 线列, 排横队, 一字排, 拉横排, 横排,
              排成一排, 排成横排, 拉成一条线]
    en: [line, form a line, line up, line formation]
  shield_wall:
    keys: [f8]
    aliases: [盾墙, 盾阵, 举盾, 结盾, 结盾阵, 龟甲阵, 盾牌墙, 举起盾牌, 结盾防御,
              铁壁, 结个盾墙, 摆盾墙, 举盾牌, 盾墙顶住, 龟壳阵, 都举盾, 龟起来, 把盾举起来]
    en: [shield wall, shields up, form a wall, wall up, raise shields]
  loose:
    keys: [f2, f3]
    aliases: [散阵, 散开, 疏散, 散开队形, 分散, 疏散队形, 散一散, 散开点儿,
              都散开, 散开点, 拉开距离, 拉开点儿, 都散一散, 别扎堆, 散一点, 别挤]
    en: [loose, spread out, loose formation, disperse, open up]
  circle:
    keys: [f2, f4]
    aliases: [圆阵, 圆形, 结圆阵, 围成圈, 围圈, 结个圆阵, 摆圆阵, 围成圆圈,
              抱团, 结成圆阵, 围一圈, 圈起来, 围起来]
    en: [circle, form a circle, circle formation, ring]
  square:
    keys: [f2, f5]
    aliases: [方阵, 方形阵, 结方阵, 结个方阵, 摆方阵, 方形, 排方阵, 结成方阵]
    en: [square, form a square, square formation]
  skein:
    keys: [f2, f6]
    aliases: [三角阵, 尖阵, 尖头阵, 楔阵, 楔形, 楔形阵, 锥形阵, 锥子阵, 结楔阵, 尖刀阵]
    en: [wedge, triangle, form a wedge, wedge formation, spearhead]
  column:
    keys: [f2, f7]
    aliases: [排成一列, 竖排, 竖着排, 排成竖排, 排成一竖排, 纵队, 纵列, 排纵队,
              一列纵队, 列队前进, 行军纵队]
    en: [column, single file, form a column, march column]
  scatter:
    keys: [f2, f8]
    aliases: [乱阵, 散兵, 四散, 散兵线, 各自为战, 打散, 散兵游勇, 各自散开,
              自由散开, 自由站位, 打乱队形]
    en: [scatter, break formation, scatter formation, every man for himself]

  # ---------- 顶层直接生效键 (F4~F9 无子菜单, 单键) ----------
  fire_at_will:
    keys: [f4]
    aliases: [自由射击, 放箭, 射击, 开火, 给我射, 放, 放箭啊, 射他们, 开射,
              攒射, 射啊, 给我放箭, 放箭射击, 自由开火, 尽情射击, 火力全开, 射起来]
    en: [fire, fire at will, open fire, shoot them, let them fly]
  hold_fire:
    keys: [f4]
    aliases: [停止射击, 别射, 收弓, 停火, 别放箭, 别射了, 停手, 别开火, 住手,
              收着点儿, 别放了, 都别射, 停止放箭, 收手, 省点箭]
    en: [hold fire, cease fire, stop shooting, hold your fire]
  mount_toggle:
    keys: [f5]
    # "上马冲锋"已移除: 包含 charge 的完整别名"冲锋", 会把光杆"冲锋"抢成上马
    aliases: [上马, 骑马, 下马, 步战, 上下马, 都上马, 骑上马, 都下马, 下来步战,
              下马作战, 翻身上马]
    en: [mount, dismount, mount up, get on your horses, get off your horses]
  ai_control:
    keys: [f6]
    aliases: [交给AI, 自动, 托管, 你来指挥, 自动作战, 委派指挥, 你来指挥吧,
              自动打, AI接管, 自己打, 交给电脑, 自动指挥, 你们自己来, 自由发挥]
    en: [ai control, give ai control, take over, auto command, you command them]
  face_direction:
    keys: [f7]
    aliases: [朝向方向, 转向, 面向这边, 朝这边, 改朝向, 看这边, 朝着敌人, 看那儿,
              转过来, 转个向, 面朝那边儿, 朝那边儿, 面向那儿]
    en: [face direction, face this way, turn to face, face the enemy]

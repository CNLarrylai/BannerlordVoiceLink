# ============================================================
#  指令词典 —— 这是整个软件的"大脑", 你可以随意增删/改说法
# ============================================================
#
#  结构说明:
#   groups : 兵种/编队 -> 选中它要按的数字键 (0 = 全军听令)
#   orders : 指令      -> 选中编队后要按的按键序列
#   aliases: 中文说法; en: 英文说法 (启动器选语言, 两套分开用, 键位共用)
#
#  改完在语音程序里按 [F10] 热重载, 不用重启。
#  ⚠️ 按键序列必须与 docs/bannerlord-orders.md 一致; 禁止凭感觉改键位。
# ============================================================

groups:
  infantry:
    key: "1"
    aliases: [步兵, 步兵们, 步卒, 盾兵, 刀盾兵, 长矛兵, 近战, 近战兵, 大头兵,
              一队, 第一队, 步兵队]
    en: [infantry, foot, footmen, foot soldiers, spearmen, group one, first group, group 1, groove 1]
  archers:
    key: "2"
    aliases: [弓箭手, 弓箭手们, 弓兵, 射手, 神射手, 弓弩手, 远程, 弓手, 射箭的,
              放箭的, 二队, 第二队]
    en: [archers, bowmen, ranged, bows, archer, group two, second group, group 2, groove 2]
  cavalry:
    key: "3"
    # 注意: 别名不能"包含其它指令的完整别名"(如曾有的"冲锋骑"包含"冲锋"),
    # 否则光杆短指令会滑进长别名拿满分, 同分比长度反而错赢 -> 乱路由。
    aliases: [骑兵, 骑兵们, 重骑, 重骑兵, 骑士, 突骑, 马队, 骑马的,
              三队, 第三队]
    en: [cavalry, horsemen, knights, horse, riders, group three, third group, group 3, groove 3]
  horse_archers:
    key: "4"
    aliases: [骑射, 骑射手, 骑射兵, 骑射们, 第四队, 四队, 四号队, 游骑,
              弓骑, 弓骑兵, 空骑兵, 空骑手]
    en: [horse archers, mounted archers, horse archer, group four, fourth group, group 4, groove 4]
  all:
    key: "0"
    aliases: [全军, 全体, 所有人, 所有队伍, 大家, 大伙, 大伙儿, 士兵, 士兵们,
              全部队伍, 全部人, 全员, 儿郎们, 众将士, 全军将士, 各队, 各位]
    # 英文口音容错: 非母语者 "All" 的尾音 L 常吞掉, Whisper 会写成 or/oh
    # (2026-09-02 实测 "All units charge" 三连听成 "Or unit charge")。
    # 只收 "or/oh + units/unit/troops" 这种固定搭配, 不收裸 or/oh。
    en: [everyone, all troops, all units, all unit, everybody, whole army,
         all of you, all, or units, or unit, oh units, oh unit, or troops,
         oh troops, all the units, all the troops]
  # 左右半队必须带兵种前缀(骑兵左队/弓箭手右队): 光喊"左队"太危险 —— 一旦
  # "左队"被漏听就退化成对当前选中编队冲锋(可能是全军), 用户实测后要求去掉。
  # 分队后的左/右半队(需模组): key 名 = <兵种>_<left|right>, 是"伪兵种",
  # 只用来解析"哪个兵种的哪半队", 由 main 拆出兵种+左右路由给模组 sideorder。
  # 左=原队, 右=新分出的队(固定身份, 不看位置); 必须带兵种前缀防混淆
  # 不收裸的"骑射右"两字形: 右/游/由/又 同音, "骑射游击"会被它抢成右队(实测)
  # (骑兵分左右 与 弓箭手分左右 各记一套)。别名首项=浮层显示名。
  infantry_left:
    key: ""
    aliases: [步兵左队, 左路步兵, 左边步兵, 步兵左路, 步兵左半]
    en: [infantry left, left infantry]
  infantry_right:
    key: ""
    aliases: [步兵右队, 右路步兵, 右边步兵, 步兵右路, 步兵右半]
    en: [infantry right, right infantry]
  archers_left:
    key: ""
    aliases: [弓箭手左队, 弓兵左队, 左路弓箭手, 左边弓箭手, 弓兵左]
    en: [archers left, left archers]
  archers_right:
    key: ""
    aliases: [弓箭手右队, 弓兵右队, 右路弓箭手, 右边弓箭手, 弓兵右]
    en: [archers right, right archers]
  cavalry_left:
    key: ""
    aliases: [骑兵左队, 左路骑兵, 左边骑兵, 骑兵左路, 骑兵左半]
    en: [cavalry left, left cavalry]
  cavalry_right:
    key: ""
    aliases: [骑兵右队, 右路骑兵, 右边骑兵, 骑兵右路, 骑兵右半]
    en: [cavalry right, right cavalry]
  horse_archers_left:
    key: ""
    aliases: [骑射左队, 左路骑射, 左边骑射, 骑射左路, 骑射手左队]
    en: [horse archers left, left horse archers]
  horse_archers_right:
    key: ""
    aliases: [骑射右队, 右路骑射, 右边骑射, 骑射右路, 骑射手右队]
    en: [horse archers right, right horse archers]
  # 英文数字形("group 2")必须显式收录: Whisper 常输出阿拉伯数字, 只有 "group two"
  # 时 "group 2, follow me" 会模糊蹭成 group four(2026-09-02 实测)。
  # 按编队槽位号直接指挥(需模组): 第五~八队是分队后新队落的空槽(第一~四队
  # 已是步/弓/骑/骑射的别名, 走按键)。key 名 form<N> 由 main 拆出槽位号路由。
  # "第五队"这类纯位置编号谁都懂, 和"骑兵右队"指同一支队, 两个名字都能喊。
  form5:
    key: ""
    aliases: [第五队, 五队, 第5队, 五号队]
    en: [fifth group, formation five, group five, group 5, groove 5]
  form6:
    key: ""
    aliases: [第六队, 六队, 第6队, 六号队]
    en: [sixth group, formation six, group six, group 6, groove 6]
  form7:
    key: ""
    aliases: [第七队, 七队, 第7队, 七号队]
    en: [seventh group, formation seven, group seven, group 7, groove 7]
  form8:
    key: ""
    aliases: [第八队, 八队, 第8队, 八号队]
    en: [eighth group, formation eight, group eight, group 8, groove 8]

orders:
  # ---------- 移动类 (F1 子菜单) ----------
  to_position:
    keys: [f1, f1]
    aliases: [到这里, 去那里, 来这里, 守住这里, 到指定位置, 就位, 到位, 去那儿,
              到这儿, 来这儿, 守这儿, 站这儿, 待在这儿, 去那边儿, 到那边儿,
              守住这儿, 去那边, 到那边, 守这里, 站这里, 过来]
    en: [move here, go there, hold this position, take position, move to position]
  follow_me:
    keys: [f1, f2]
    aliases: [随我来, 跟随我, 跟着我, 跟我走, 跟我上, 跟我冲, 跟上, 跟着我走,
              都跟上, 跟紧我, 跟紧点儿, 跟我来, 都跟着我, 护驾, 救驾, 保护我,
              来救我, 到我这里来, 到我这儿来, 来我这, 到我身边, 别掉队]
    en: [follow me, on me, with me, rally to me, stay with me]
  charge:
    # 指向性攻击(游戏1.2+原生): 鼠标/准星指着敌方编队图标(出现绿色四角准星)
    # 时下这条指令, 就会攻击那支特定敌军 —— "看着谁就打谁", 键序完全相同。
    # takes_target: 允许"骑兵进攻弓箭手"句式 —— 动词前=选自家谁, 动词后=打谁
    # (目标显示在浮层, 实际锁定靠准星悬停; 未来模组接管后变成真锁定)。
    takes_target: true
    keys: [f1, f3]
    # 注: "打他们/打他" 移到 focus_target(集火眼前那支, 玩家'打他打他'的直觉);
    # charge 泛指冲锋保留"冲他们/攻击他们"等。
    # "出击"必须显式收录: 不在词典时, "全军出击"会被"护驾"(hujia)拼音蹭到89分
    # 错路由成跟随我(2026-07-09 实战日志钓出, 连错三次)。
    # "攻击对方/敌方"显式收录: 不在词典时"骑兵攻击对方弓箭手"走拼音模糊, 目标重扫
    # 跑偏成骑射手左队(2026-09 钓出)。但裸"攻击"绝不能收: gongji 藏在"弓箭"
    # gongjian 的拼音里, 带弓箭手的句子全会中冲锋("弓箭手去那"→冲锋, 实测)。
    aliases: [冲锋, 冲, 进攻, 攻击对方, 攻击敌方, 攻击敌人, 突击, 出击, 杀, 给我冲,
              冲上去, 冲啊, 冲呀, 冲鸭,
              给我上, 上啊, 冲过去, 杀过去, 干他们, 打过去, 给我杀, 杀啊,
              往上冲, 压上去打, 冲他们, 攻击他们, 灭了他们, 开干, 开团, 怼上去]
    # 英文与中文对齐: "attack them / kill them / get them" = 中文"打他们",
    # 归 focus_target(就近集火); 这里只留泛指冲锋的说法(2026-09 用户反馈
    # "attack them" 被当普通冲锋, 就近攻击在英文下触发不了)。
    en: [charge, attack, engage, charge them, charge in, go go go]
  # 注: 曾有独立的 attack_nearest("打最近的"), 已删 —— 游戏原生冲锋(charge)
  # 本就让编队去打最近的敌人, 单列冗余。模组的独特价值是"定向按兵种攻击"
  # (骑兵专打敌弓箭手), 走 charge 的 takes_target, 不需要单独指令。
  advance:
    takes_target: true   # 交战(F1F4)同样支持指向性目标, 见 charge 注释
    keys: [f1, f4]
    aliases: [开战, 交战, 前进, 进军, 推进, 慢慢推进, 上前, 向前, 往前走, 压上去,
              顶上去, 向前推, 推上去, 往前压, 往前顶, 上前压, 压上]
    en: [advance, move up, push forward, forward, push up, engage the enemy]
  split:
    # 需伴侣模组: 把某兵种一分为二(原生 Formation.Split), 之后可"左队/右队"
    # 分别指挥。keys 空 —— 纯模组指令, 不走按键; 需搭配具体兵种("骑兵分队")。
    keys: []
    aliases: [分队, 一分为二, 分成两队, 分兵, 分成两拨, 一分为二分队, 拆成两队,
              分作两队, 分兵两路]
    en: [split, divide, split in two, split up, divide in two, split into two,
         split into two groups, split in two groups, split the formation]
  flank:
    # 需伴侣模组: 战术层指令 —— 该编队交给 AI 执行原生 BehaviorFlank(绕后包抄),
    # 键盘玩家摸不到的 FormationAI 层。喊"听令"或任何直接指令即收回。
    # takes_target: "Cavalry, flank their archers" 这种带目标的自然说法要能过
    # (目标只用于显示/占比, 行为本身绕最近敌军)。
    keys: []
    takes_target: true
    aliases: [绕后, 绕后包抄, 绕到后面, 绕到背后, 抄后路, 迂回包抄, 绕背偷袭,
              绕后袭扰, 去绕后]
    en: [flank, flank them, go around, flank attack]
  # ---- 战术层第二批(2026-09, 全部过了三方向冲突检索: 现词典误路由 / 加入后
  # 741 条真实句零变化 / 新句路由零错)。都是纯模组指令, 喊"听令"收回。----
  hold_high_ground:
    # BehaviorHoldHighGround: 找预判战场附近的高地站住, 线阵纵深自由射击;
    # 有己方弓箭手时按其射程留距离。没收录时"上高地"会被拼音蹭成上马(实测)。
    keys: []
    aliases: [占高地, 抢高地, 占领高地, 上高地, 守高地, 占据高地, 抢占高地, 去高处]
    en: [hold the high ground, take the high ground, seize the high ground, high ground]
  skirmish:
    # 游击: 模组按兵种选实现(骑射 HorseArcherSkirmish / 步弓 Skirmish / 骑兵
    # MountedSkirmish), 对外一条指令。"拉扯""风筝"太短太泛(误听"下车"会蹭到), 不收。
    keys: []
    aliases: [游击, 游走射击, 放风筝, 骚扰, 游走, 游击战术, 游斗]
    # skimish/scumish: 2026-09-02 实测 Whisper 对 skirmish 的两种错听
    en: [skirmish, harass them, kite them, hit and run, skimish, scumish, skirmish them]
  cautious_advance:
    # BehaviorCautiousAdvance: 有盾结盾墙/无盾散阵, 贴着己方弓箭手射程推进, 挨射
    # 就顿 —— 与"前进"(F1F4 直走)的区别。含"推进/前进"的别名不会被 advance 抢:
    # 同分时更长整词赢(回归锁定)。
    keys: []
    aliases: [稳步推进, 缓慢推进, 稳住推进, 步步为营, 稳扎稳打, 稳步前进, 小心推进]
    en: [advance carefully, advance cautiously, cautious advance, slow advance,
         advance slowly, careful advance]
  protect:
    # 护弓: BehaviorDefensiveRing 围着最大的弓箭手编队结圆阵。别名只放动词,
    # "弓箭手"作为动词后的目标解析(takes_target) —— 别名里含兵种名会让所有带
    # "弓箭手"的句子都被它蹭到(实测抢走"弓箭手去那")。没目标或目标不是弓箭手
    # => 主程序拒绝并提示。
    keys: []
    takes_target: true
    aliases: [保护, 护住, 掩护, 护着, 守护, 护卫]
    en: [protect the, guard the, cover the, defend the, protect, guard]
  guard_left:
    # 护弓指定侧翼(用户设计): 骑兵不能挡在弓箭手和敌人之间碍射线, 该站侧翼。
    # 左/右翼 = 弓箭手朝敌方向的左/右手边 25m; 敌军逼近弓箭手就冲, 退开归位。
    keys: []
    # 只收 4 字以上: 3 字的"护右翼"会被拼音对齐成裸"右翼"(youyi), "友谊/有一些"直接满分误触
    aliases: [保护左翼, 掩护左翼, 保护左侧, 守住左翼, 左翼掩护]
    en: [protect the left flank, guard the left flank, cover the left flank,
         left flank guard, hold the left flank]
  guard_right:
    keys: []
    aliases: [保护右翼, 掩护右翼, 保护右侧, 守住右翼, 右翼掩护]
    en: [protect the right flank, guard the right flank, cover the right flank,
         right flank guard, hold the right flank]
  reclaim:
    # 战术托管的收回: "骑兵听令"=骑兵收回指挥权回到手动。全军听令=全收。
    keys: []
    aliases: [听令, 听我指挥, 收回指挥, 回来听令, 听候号令]
    # "on me" 不能收: 已是 follow_me 的别名(跟我), 二义。首项与横幅提示一致。
    en: [manual control, back to my command, await orders, take back control]
  focus_target:
    # 需伴侣模组: 集火离玩家最近的那支敌军(混战里"打这只军队/打他打他"最本能,
    # 多半就指玩家眼前那支)。所有被下令编队集火同一支。模组不可用退化为
    # 普通冲锋(F1F3)。别名刻意与 charge 的"打他们"(泛指全军冲锋)区分。
    # "军队"曾被误认成兵种"马队", 已在 matcher 的"寄生子串抑制"里根治。
    modlink_target: player
    keys: [f1, f3]
    aliases: [打这只, 打这只军队, 打那只, 打那只军队, 就打这只, 集火这只,
              集火这只军队, 打这一只, 打面前这只, 灭了这只, 打眼前这只,
              打他们, 打他, 打他打他, 秒他, 搞他, 盯着这只打, 集火, 集火他]
    en: [attack them, get them, go get them, kill them, take them out, hit them,
         focus them, attack that one, get that one, focus that, hit that one,
         focus fire, attack the nearest, attack nearest, nearest enemy]
  fall_back:
    keys: [f1, f5]
    # "回来"显式收录: 实战高频说法(骑兵回来/弓箭手回来), 曾只靠"退回来"模糊80分接
    aliases: [退后, 后退, 回来, 撤一点, 往后, 后撤, 往后退, 退一退, 撤一撤, 往后撤,
              退回来, 后撤点儿, 往后点儿, 往后退点儿, 退一点儿, 回防]
    en: [fall back, pull back, back up, move back, give ground]
  halt:
    keys: [f1, f6]
    aliases: [立定, 停止, 停下, 站住, 原地待命, 待命, 别动, 停, 停一停, 都别动,
              原地不动, 稳住, 别走, 停在那儿, 站那儿别动, 都停下, 都停一停, 停停停]
    en: [halt, stop, hold, stand ground, hold position, hold there, stay here,
         stay put, stay there, hold your ground, stand your ground,
         hold your position, remain here, dont move, freeze]
  retreat:
    keys: [f1, f7]
    aliases: [撤退, 快跑, 撤离, 快撤, 撤了, 跑路, 快跑啊, 撤退了,
              撤下来, 都撤, 快撤啊, 撤退吧]
    en: [retreat, run away, flee, sound the retreat, pull out]

  # ---------- 队形类 (F2 子菜单) ----------
  line:
    keys: [f9]
    aliases: [线阵, 横队, 一字排开, 排成线, 线列, 排横队, 一字排, 拉横排, 横排,
              排成一排, 排成横排, 拉成一条线]
    en: [line, form a line, line up, line formation]
  shield_wall:
    keys: [f8]
    aliases: [盾墙, 盾阵, 举盾, 结盾, 结盾阵, 龟甲阵, 盾牌墙, 举起盾牌, 结盾防御,
              铁壁, 结个盾墙, 摆盾墙, 举盾牌, 盾墙顶住, 龟壳阵, 都举盾, 龟起来, 把盾举起来]
    en: [shield wall, shields up, form a wall, wall up, raise shields]
  loose:
    keys: [f2, f3]
    aliases: [散阵, 散开, 疏散, 散开队形, 分散, 疏散队形, 散一散, 散开点儿,
              都散开, 散开点, 拉开距离, 拉开点儿, 都散一散, 别扎堆, 散一点, 别挤]
    en: [loose, spread out, loose formation, disperse, open up]
  circle:
    keys: [f2, f4]

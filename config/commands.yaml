# ============================================================
#  指令词典 —— 这是整个软件的"大脑", 你可以随意增删/改说法
# ============================================================
#
#  结构说明:
#   groups : 兵种/编队 -> 选中它要按的数字键 (0 = 全军听令)
#   orders : 指令      -> 选中编队后要按的按键序列
#   aliases: 中文说法; en: 英文说法 (启动器选语言, 两套分开用, 键位共用)
#
#  改完在语音程序里按 [F10] 热重载, 不用重启。
#  ⚠️ 按键序列必须与 docs/bannerlord-orders.md 一致; 禁止凭感觉改键位。
# ============================================================

groups:
  infantry:
    key: "1"
    aliases: [步兵, 步兵们, 步卒, 盾兵, 刀盾兵, 长矛兵, 近战, 近战兵, 大头兵,
              一队, 第一队, 步兵队]
    en: [infantry, foot, footmen, foot soldiers, spearmen, group one, first group]
  archers:
    key: "2"
    aliases: [弓箭手, 弓箭手们, 弓兵, 射手, 神射手, 弓弩手, 远程, 弓手, 射箭的,
              放箭的, 二队, 第二队]
    en: [archers, bowmen, ranged, bows, archer, group two, second group]
  cavalry:
    key: "3"
    aliases: [骑兵, 骑兵们, 重骑, 重骑兵, 骑士, 冲锋骑, 突骑, 马队, 骑马的,
              三队, 第三队]
    en: [cavalry, horsemen, knights, horse, riders, group three, third group]
  horse_archers:
    key: "4"
    aliases: [骑射, 骑射手, 骑射兵, 骑射们, 第四队, 四队, 四号队, 游骑,
              弓骑, 弓骑兵, 空骑兵, 空骑手]
    en: [horse archers, mounted archers, horse archer, group four, fourth group]
  all:
    key: "0"
    aliases: [全军, 全体, 所有人, 所有队伍, 大家, 大伙, 大伙儿, 士兵, 士兵们,
              全部队伍, 全部人, 全员, 儿郎们, 众将士, 全军将士, 各队, 各位]
    en: [everyone, all troops, all units, everybody, whole army, all of you, all]

orders:
  # ---------- 移动类 (F1 子菜单) ----------
  to_position:
    keys: [f1, f1]
    aliases: [到这里, 去那里, 守住这里, 到指定位置, 就位, 到位, 去那儿, 到这儿,
              来这儿, 守这儿, 站这儿, 待在这儿, 去那边儿, 到那边儿, 守住这儿,
              去那边, 到那边, 守这里, 站这里]
    en: [move here, go there, hold this position, take position, move to position]
  follow_me:
    keys: [f1, f2]
    aliases: [随我来, 跟随我, 跟着我, 跟我走, 跟我上, 跟我冲, 跟上, 跟着我走,
              都跟上, 跟紧我, 跟紧点儿, 跟我来, 都跟着我, 护驾, 救驾, 保护我,
              来救我, 到我这里来, 到我这儿来]
    en: [follow me, on me, with me, rally to me, stay with me]
  charge:
    # 指向性攻击(游戏1.2+原生): 鼠标/准星指着敌方编队图标(出现绿色四角准星)
    # 时下这条指令, 就会攻击那支特定敌军 —— "看着谁就打谁", 键序完全相同。
    # takes_target: 允许"骑兵进攻弓箭手"句式 —— 动词前=选自家谁, 动词后=打谁
    # (目标显示在浮层, 实际锁定靠准星悬停; 未来模组接管后变成真锁定)。
    takes_target: true
    keys: [f1, f3]
    aliases: [冲锋, 冲, 进攻, 突击, 杀, 给我冲, 冲上去, 冲啊, 冲呀, 冲鸭,
              给我上, 上啊, 冲过去, 杀过去, 干他们, 打过去, 给我杀, 杀啊,
              往上冲, 压上去打, 打他们, 冲他们, 攻击他们, 灭了他们]
    en: [charge, attack, engage, charge them, attack them, go get them,
         take them out, focus them, kill them]
  attack_nearest:
    # 需要伴侣模组(mod/BannerlordVoiceLink): 语音直接命令编队攻击"最近的"敌军,
    # 不用准星。模组不可用时退化为普通冲锋(F1F3, 游戏冲锋本就先打就近之敌)。
    modlink_target: nearest
    keys: [f1, f3]
    aliases: [打最近的, 攻击最近的, 进攻最近的敌人, 打最近的敌人, 冲最近的,
              攻击最近目标]
    en: [attack nearest, attack the nearest, charge the nearest, attack closest,
         attack the closest enemy]
  advance:
    takes_target: true   # 交战(F1F4)同样支持指向性目标, 见 charge 注释
    keys: [f1, f4]
    aliases: [开战, 交战, 前进, 进军, 推进, 上前, 向前, 往前走, 压上去, 顶上去,
              向前推, 推上去, 往前压, 往前顶, 上前压]
    en: [advance, move up, push forward, forward, push up, engage the enemy]
  fall_back:
    keys: [f1, f5]
    aliases: [退后, 后退, 撤一点, 往后, 后撤, 往后退, 退一退, 撤一撤, 往后撤,
              退回来, 后撤点儿, 往后点儿, 往后退点儿, 退一点儿]
    en: [fall back, pull back, back up, move back, give ground]
  halt:
    keys: [f1, f6]
    aliases: [立定, 停止, 停下, 站住, 原地待命, 别动, 停, 停一停, 都别动,
              原地不动, 稳住, 别走, 停在那儿, 站那儿别动, 都停下, 都停一停]
    en: [halt, stop, hold, stand ground, hold position, hold there, stay here,
         stay put, stay there, hold your ground, stand your ground,
         hold your position, remain here, dont move, freeze]
  retreat:
    keys: [f1, f7]
    aliases: [撤退, 快跑, 撤离, 快撤, 撤了, 跑路, 快跑啊, 撤退了,
              撤下来, 都撤, 快撤啊, 撤退吧]
    en: [retreat, run away, flee, sound the retreat, pull out]

  # ---------- 队形类 (F2 子菜单) ----------
  line:
    keys: [f9]
    aliases: [线阵, 横队, 一字排开, 排成线, 线列, 排横队, 一字排, 拉横排, 横排,
              排成一排, 排成横排, 拉成一条线]
    en: [line, form a line, line up, line formation]
  shield_wall:
    keys: [f8]
    aliases: [盾墙, 盾阵, 举盾, 结盾, 结盾阵, 龟甲阵, 盾牌墙, 举起盾牌, 结盾防御,
              铁壁, 结个盾墙, 摆盾墙, 举盾牌, 盾墙顶住, 龟壳阵, 都举盾]
    en: [shield wall, shields up, form a wall, wall up, raise shields]
  loose:
    keys: [f2, f3]
    aliases: [散阵, 散开, 疏散, 散开队形, 分散, 疏散队形, 散一散, 散开点儿,
              都散开, 散开点, 拉开距离, 拉开点儿, 都散一散]
    en: [loose, spread out, loose formation, disperse, open up]
  circle:
    keys: [f2, f4]
    aliases: [圆阵, 圆形, 结圆阵, 围成圈, 围圈, 结个圆阵, 摆圆阵, 围成圆圈,
              抱团, 结成圆阵]
    en: [circle, form a circle, circle formation, ring]
  square:
    keys: [f2, f5]
    aliases: [方阵, 方形阵, 结方阵, 结个方阵, 摆方阵, 方形, 排方阵, 结成方阵]
    en: [square, form a square, square formation]
  skein:
    keys: [f2, f6]
    aliases: [三角阵, 尖阵, 尖头阵, 楔阵, 楔形, 楔形阵, 锥形阵, 锥子阵, 结楔阵]
    en: [wedge, triangle, form a wedge, wedge formation, spearhead]
  column:
    keys: [f2, f7]
    aliases: [排成一列, 竖排, 竖着排, 排成竖排, 排成一竖排, 纵队, 纵列, 排纵队,
              一列纵队, 列队前进, 行军纵队]
    en: [column, single file, form a column, march column]
  scatter:
    keys: [f2, f8]
    aliases: [乱阵, 散兵, 四散, 散兵线, 各自为战, 打散, 散兵游勇, 各自散开,
              自由散开]
    en: [scatter, break formation, scatter formation, every man for himself]

  # ---------- 顶层直接生效键 (F4~F9 无子菜单, 单键) ----------
  fire_at_will:
    keys: [f4]
    aliases: [自由射击, 放箭, 射击, 开火, 给我射, 放, 放箭啊, 射他们, 开射,
              攒射, 射啊, 给我放箭, 放箭射击, 自由开火, 尽情射击]

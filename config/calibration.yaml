# ============================================================
#  校准题库 —— 新玩家跟读的默认清单 (可自行增删)
# ============================================================
#  group/order 用 commands.yaml 里的键名; 两者都填 = 组合句(只练习,
#  不做错听学习)。
#  当使用记录攒够 min_usage_rows 条后, 校准会自动改用"你实际最常用的
#  top_n 条"出题 (数据在 logs/usage.csv, 仅本地) —— 默认清单只是冷启动。
#  注: 以上是「快速校准」的题源。「完整校准」(默认按钮)不读这里, 直接按
#  commands.yaml 当前支持的全部指令生成题库(每条一遍, 需语境的自动配兵种)。
# ============================================================
min_usage_rows: 40
top_n: 20
drill:
  - {group: infantry}
  - {group: archers}
  - {group: cavalry}
  - {group: horse_archers}
  - {group: all}
  - {order: charge}
  - {order: halt}
  - {order: advance}
  - {order: fall_back}
  - {order: retreat}
  - {order: shield_wall}
  - {order: line}
  - {order: loose}
  - {order: fire_at_will}
  - {order: hold_fire}
  - {order: mount_toggle}
  - {group: all, order: charge}
  - {group: cavalry, order: charge}
